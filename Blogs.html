<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/global.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            fetch("/navbar.html")
                .then((res) => res.text())
                .then((data) => {
                    document.getElementById("navbar").innerHTML = data;
                    lucide.createIcons(); // Initialize icons after insertion
                    const currentPath = window.location.pathname;

                    // Highlight desktop links
                    document.querySelectorAll("#navbar nav a").forEach((link) => {
                        const linkPath = new URL(link.href).pathname;
                        if (currentPath === linkPath) {
                            link.classList.add("font-bold");
                            link.classList.remove("text-[#7E7E7E]");
                            link.classList.add("text-[#687DA9]");
                        }
                    });

                    // Highlight mobile links
                    document.querySelectorAll("#mobile-menu nav a").forEach((link) => {
                        const linkPath = new URL(link.href).pathname;
                        if (currentPath === linkPath) {
                            link.classList.add("font-bold");
                            link.classList.remove("text-[#7E7E7E]");
                            link.classList.add("text-[#687DA9]");
                        }
                    });


                    // ✅ MOVE THIS LOGIC HERE so it runs after navbar is injected
                    const mobileMenuButton = document.getElementById("mobile-menu-button");
                    const closeMenuButton = document.getElementById("close-menu-button");
                    const mobileMenu = document.getElementById("mobile-menu");

                    if (!mobileMenuButton || !mobileMenu) {
                        console.error("Mobile menu button or menu is missing.");
                        return;
                    }

                    mobileMenuButton.addEventListener("click", function () {
                        console.log("Mobile menu button clicked");
                        mobileMenu.classList.toggle("hidden");
                        mobileMenu.classList.toggle("flex");
                        document.body.classList.toggle("overflow-hidden");
                    });

                    closeMenuButton.addEventListener("click", function () {
                        mobileMenu.classList.add("hidden");
                        mobileMenu.classList.remove("flex");
                        document.body.classList.remove("overflow-hidden");
                    });

                    const mobileDropdownToggles = document.querySelectorAll(
                        ".mobile-dropdown-toggle"
                    );

                    mobileDropdownToggles.forEach((toggle) => {
                        toggle.addEventListener("click", function () {
                            const content = this.nextElementSibling;
                            const icon = this.querySelector('[data-lucide="chevron-down"]');

                            content.classList.toggle("hidden");
                            icon.style.transform = content.classList.contains("hidden")
                                ? "rotate(0deg)"
                                : "rotate(180deg)";
                        });
                    });
                });
        });
    </script>


    <style>
        .testimonial-slide {
            transition: opacity 0.5s ease-in-out;
        }

        .testimonial-slide:not(.active) {
            display: none;
            opacity: 0;
        }

        .testimonial-slide.active {
            display: flex;
            opacity: 1;
        }

        /* Make images square on mobile */
        @media (max-width: 768px) {
            .square-on-mobile {
                position: relative;
                width: 100%;
                padding-bottom: 100%;
                /* Creates a square */
                overflow: hidden;
            }

            .square-on-mobile img {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
</head>

<body>

    <div id="navbar"></div>

    <!-- Hero Section -->
    <section class="relative h-[300px] bg-cover bg-center" style="background-image: url('assets/blog_banner.png');">
        <div class="absolute inset-0  flex items-center justify-center">
            <h1 class="text-white text-4xl font-semibold">Blogs</h1>
        </div>
    </section>

    <!--Blogs List Section-->
    <section class=" mt-[80px]">

        <div id="content" class="space-y-6  mx-auto "></div>

        <!-- Pagination Controls -->
        <div class="w-full mt-10 lg:px-[130px]">
            <div class="w-full bg-white  rounded-lg py-3 px-4" style="border: 1px solid #E0DEDD">
                <!-- <div class="flex justify-center"> -->
                <div id="pagination" class="flex justify-between space-x-2"></div>
                <!-- </div> -->
            </div>
        </div>

        <script src="/js/blogs.js"></script>

    </section>



    <!-- Footer -->
    <div id="footer"></div>
    <script>
        // Load footer dynamically
        fetch("footer.html")
            .then(res => res.text())
            .then(data => {
                const footerContainer = document.getElementById("footer");
                footerContainer.innerHTML = data;

                // After footer is added, initialize footer animations
                initFooterAnimations();
            })
            .catch(err => console.error("Error loading footer:", err));

        function initFooterAnimations() {
            const footerObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const delay = parseInt(entry.target.getAttribute('data-delay')) || 0;
                        setTimeout(() => {
                            entry.target.classList.remove('opacity-0', 'translate-y-10');
                            entry.target.classList.add('opacity-100', 'translate-y-0');
                        }, delay);
                    }
                });
            }, { threshold: 0.2 });

            const footerElements = document.querySelectorAll('#footer [data-delay]');
            footerElements.forEach(el => footerObserver.observe(el));
            // Zoom-in animation for social icons
            const socialIcons = document.querySelectorAll('#footer img'); // target your social icons
            socialIcons.forEach(icon => {
                icon.classList.add('scale-0', 'transition-transform', 'duration-700', 'ease-out');
            });

            const iconObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.remove('scale-0');
                        entry.target.classList.add('scale-100');
                    }
                });
            }, { threshold: 0.2 });

            socialIcons.forEach(icon => iconObserver.observe(icon));
        }

    </script>

    <!-- Tailwind overrides -->
    <style>
        .opacity-100 {
            opacity: 1;
        }

        .translate-y-0 {
            transform: translateY(0);
        }

        .scale-0 {
            transform: scale(0);
        }

        .scale-100 {
            transform: scale(1);
        }
    </style>
</body>

</html>
